metadata:
  id: CONTEXTGEO-COMPLEX-015
  name: Integrate OSM, Census, and Sentinel-2 data for Phoenix to identify underserved
    areas (low hospital access + high population + low vegetation).
  version: 1.0.0
  benchmark: MMGIS-Bench-ContextGeo150
  split: test
  category: data_integration
  difficulty: hard
  author: Nguyen Kim Son
  created: '2026-08-02'
  description: Manually designed ContextGeo task imported from data/tasks_150.json.
    Ground truth is operation-level.
  tags:
  - contextgeo
  - complex_015
  - multi
  - data_integration
  - hard
datasets:
- id: multi
  name: ContextGeo multi-source bundle
  provider: multi_source
  asset: multi
  citation: OSM + US Census/ACS + Sentinel-2
- id: osm
  name: OpenStreetMap
  provider: osm
  asset: osm
- id: census
  name: United States Census / ACS
  provider: us_census
  asset: census
- id: sentinel2
  name: Sentinel-2 imagery
  provider: esa
  asset: sentinel2
  resolution: 10
input:
  modality: text
  platform: general_gis
  dataset: multi
  prompt: Integrate OSM, Census, and Sentinel-2 data for Phoenix to identify underserved
    areas (low hospital access + high population + low vegetation).
  system_prompt: You are evaluating a geospatial analysis task. Return a concrete
    and reproducible workflow with clear ordered steps, assumptions, intermediate
    outputs, and validation checks. Do not fabricate final numeric values when the
    source data have not actually been executed.
output:
  output_type: workflow
  expected_operations: &id001
  - load_multiple
  - spatial_join
  - overlay_analysis
  - multi_criteria_evaluation
  structured_output:
    source_task_id: complex_015
    source_dataset: multi
    source_type: data_integration
    expected_operations: *id001
  reference_notes: The attached ContextGeo source defines expected GIS operations,
    not a universal exact numeric answer. Evaluation therefore uses operation coverage
    and workflow ordering.
evaluation:
  metrics:
  - operation_precision
  - operation_recall
  - operation_f1
  - workflow_order
  - hallucinated_operation_rate
  reasoning_level: planning
  pass_score: 0.6
  weight: 1.0
runtime:
  timeout: 300
  internet: true
  gpu: false
  api_required: true
  memory_gb: 4.0
  max_tokens: 4096
  temperature: 0.0
  retries: 1
  cache: false
