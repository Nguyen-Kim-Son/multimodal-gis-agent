[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "mmgis-bench"
version = "1.0.0"
description = "Reproducible benchmark framework for GIS agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8,<3",
  "PyYAML>=6.0",
  "requests>=2.32",
  "python-dotenv>=1.0",
  "pandas>=2.2"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["tasks*", "models*", "benchmark*", "evaluation*", "gee*", "reports*", "experiments*", "audit*", "contextgeo_import*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
